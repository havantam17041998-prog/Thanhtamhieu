<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Tin Thanh Toán</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .payment-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 28px;
      text-align: center;
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }
    .info-group {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
    }
    .info-label {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
      word-break: break-all;
    }
    .bank-name {
      color: #2563eb;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="payment-card">
    <div class="card-title">THÔNG TIN CHUYỂN KHOẢN</div>

    <div class="info-group">
      <div class="info-label">Ngân hàng</div>
      <div class="info-value bank-name">MB BANK (Ngân hàng Quân Đội)</div>
    </div>

    <div class="info-group">
      <div class="info-label">Số tài khoản</div>
      <div class="info-value">0123456789</div>
    </div>

    <div class="info-group">
      <div class="info-label">Chủ tài khoản</div>
      <div class="info-value">CÔNG TY TNHH TM DV THANH TÂM HIẾU</div>
    </div>

    <div class="info-group">
      <div class="info-label">Nội dung chuyển khoản</div>
      <div class="info-value">[Tên khách hàng / Số điện thoại]</div>
    </div>
  </div>

</body>
</html>
